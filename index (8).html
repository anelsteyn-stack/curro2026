<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Curro Secunda Discipline</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:#0f1b2d;--navy2:#162236;--blue:#1a6ff4;--blue-soft:#2979ff22;
    --accent:#f7c325;--red:#ff4d4d;--red-soft:#ff4d4d22;
    --green:#2ecc71;--green-soft:#2ecc7122;
    --card:#1c2d44;--card2:#223350;--text:#e8edf5;
    --muted:#7a90aa;--border:#263a54;--radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--navy);color:var(--text);font-family:'Nunito',sans-serif;
    min-height:100vh;max-width:430px;margin:0 auto;overflow-x:hidden;}

  /* LOGIN / SETUP */
  .auth-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;
    justify-content:center;padding:24px;
    background:radial-gradient(ellipse at top,#1a3a5c 0%,var(--navy) 70%);}
  .login-logo{font-family:'Syne',sans-serif;font-weight:800;font-size:2.2rem;
    letter-spacing:-1px;margin-bottom:4px;}
  .login-logo span{color:var(--accent);}
  .login-sub{color:var(--muted);font-size:.85rem;margin-bottom:32px;text-align:center;}
  .auth-card{background:var(--card);border:1px solid var(--border);
    border-radius:20px;padding:28px 22px;width:100%;max-width:360px;}
  .auth-card h2{font-family:'Syne',sans-serif;font-weight:800;
    font-size:1.1rem;margin-bottom:18px;text-align:center;}
  .err-box{background:var(--red-soft);border:1px solid var(--red);color:var(--red);
    border-radius:10px;padding:10px 14px;font-size:.82rem;margin-bottom:12px;display:none;}
  
  /* APP SHELL */
  header{background:var(--navy2);padding:13px 15px;border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;z-index:100;}
  .logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1rem;letter-spacing:-.5px;}
  .logo span{color:var(--accent);}
  .hdr-right{display:flex;align-items:center;gap:7px;}
  .user-pill{background:var(--blue-soft);border:1px solid var(--blue);color:var(--blue);
    font-size:.7rem;font-weight:700;padding:4px 10px;border-radius:20px;
    font-family:'DM Mono',monospace;}
  .role-pill{font-size:.68rem;font-weight:700;padding:3px 8px;border-radius:20px;
    font-family:'DM Mono',monospace;}
  .role-edu{background:var(--green-soft);border:1px solid var(--green);color:var(--green);}
  .logout-btn{background:transparent;border:1px solid var(--border);color:var(--muted);
    border-radius:8px;padding:5px 10px;font-size:.74rem;cursor:pointer;
    font-family:'Nunito',sans-serif;}

  /* TABS */
  .tabs{display:flex;background:var(--navy2);border-bottom:1px solid var(--border);
    padding:0 10px;overflow-x:auto;}
  .tab{flex:1;min-width:55px;padding:11px 3px;text-align:center;font-size:.73rem;
    font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;
    transition:all .2s;white-space:nowrap;}
  .tab.active{color:var(--accent);border-color:var(--accent);}

  main{padding:13px;display:flex;flex-direction:column;gap:11px;}

  /* CARDS */
  .card{background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius);padding:13px;}
  .card-title{font-family:'Syne',sans-serif;font-weight:700;font-size:.78rem;
    color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;}

  /* FORMS */
  .fg{margin-bottom:10px;}
  label{font-size:.77rem;font-weight:700;color:var(--muted);display:block;margin-bottom:5px;}
  select,input[type=text],input[type=password],textarea{
    width:100%;background:var(--navy);border:1px solid var(--border);border-radius:10px;
    color:var(--text);font-family:'Nunito',sans-serif;font-size:.9rem;
    padding:10px 13px;outline:none;transition:border-color .2s;}
  select:focus,input:focus,textarea:focus{border-color:var(--blue);}
  textarea{resize:none;height:64px;}
  .pw-wrap{position:relative;}
  .pw-wrap input{padding-right:40px;}
  .eye{position:absolute;right:11px;top:50%;transform:translateY(-50%);
    background:none;border:none;color:var(--muted);cursor:pointer;font-size:1rem;}

  /* BUTTONS */
  .btn{width:100%;border:none;border-radius:12px;font-family:'Syne',sans-serif;
    font-weight:700;font-size:.93rem;padding:12px;cursor:pointer;transition:all .2s;}
  .btn-blue{background:var(--blue);color:#fff;}
  .btn-blue:hover{filter:brightness(1.12);}
  .btn-ack{background:var(--green);border:none;border-radius:8px;color:#fff;
    font-family:'Nunito',sans-serif;font-weight:700;font-size:.78rem;
    padding:6px 12px;cursor:pointer;}
  .btn-ack:hover{filter:brightness(1.1);}

  /* SEARCH */
  .sw{position:relative;margin-bottom:9px;}
  .sw input{padding-left:34px;}
  .sw .si{position:absolute;left:11px;top:50%;transform:translateY(-50%);
    color:var(--muted);font-size:.88rem;}

  /* LEARNER ITEMS */
  .ll{display:flex;flex-direction:column;gap:6px;}
  .li{background:var(--card2);border:1px solid var(--border);border-radius:10px;
    padding:10px 12px;display:flex;align-items:center;justify-content:space-between;
    cursor:pointer;transition:all .2s;}
  .li:hover,.li.sel{border-color:var(--blue);background:var(--blue-soft);}
  .li.det{border-color:var(--red)!important;}
  .li.det-ack{border-color:var(--green)!important;}
  .ln{font-weight:700;font-size:.9rem;}
  .lg{font-size:.7rem;color:var(--muted);}
  .pill{font-family:'DM Mono',monospace;font-weight:500;font-size:.8rem;
    padding:3px 9px;border-radius:20px;min-width:40px;text-align:center;}
  .pl{background:var(--green-soft);color:var(--green);}
  .pm{background:#f7c32522;color:var(--accent);}
  .ph{background:var(--red-soft);color:var(--red);animation:pulse 1.5s infinite;}
  .pack{background:var(--green-soft);color:var(--green);}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

  /* PTS SELECTOR */
  .pts-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:3px;}
  .pb{background:var(--navy);border:1px solid var(--border);border-radius:8px;
    color:var(--muted);font-family:'DM Mono',monospace;font-weight:500;
    font-size:.87rem;padding:7px 13px;cursor:pointer;transition:all .2s;}
  .pb.on{background:var(--blue);border-color:var(--blue);color:#fff;}

  /* DETENTION BANNER */
  .det-banner{background:linear-gradient(135deg,#8b0000,#c0392b);border-radius:var(--radius);
    padding:13px 15px;display:flex;align-items:flex-start;gap:10px;animation:shake .3s ease;}
  .det-banner.ack{background:linear-gradient(135deg,#1e824c,#2ecc71);animation:none;}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .det-banner .di{font-size:1.4rem;}
  .det-banner h3{font-family:'Syne',sans-serif;font-size:.93rem;font-weight:800;}
  .det-banner p{font-size:.77rem;opacity:.9;margin-top:3px;}

  /* STATS */
  .sg{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .sb{background:var(--navy);border:1px solid var(--border);border-radius:12px;
    padding:12px 10px;text-align:center;}
  .sn{font-family:'Syne',sans-serif;font-weight:800;font-size:1.45rem;}
  .sl{font-size:.69rem;color:var(--muted);margin-top:2px;}
  .sn.red{color:var(--red)}.sn.blu{color:var(--blue)}

  /* TOAST */
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);
    background:var(--green);color:#fff;font-family:'Nunito',sans-serif;font-weight:700;
    font-size:.87rem;padding:11px 22px;border-radius:30px;
    transition:transform .35s cubic-bezier(.34,1.56,.64,1);z-index:300;white-space:nowrap;}
  .toast.show{transform:translateX(-50%) translateY(0);}
  .toast.err{background:var(--red);}
  .hidden{display:none!important;}
</style>
</head>
<body>

<!-- ══ LOADING ══ -->
<div id="loadingScreen" class="auth-screen">
  <div class="login-logo">Curro Secunda <span>Discipline</span></div>
  <div class="login-sub">Connecting to live database…</div>
  <div style="margin-top:20px;font-size:2rem">⏳</div>
</div>

<!-- ══ APP SHELL ══ -->
<div id="app" class="hidden">
  <header>
    <div class="logo">Curro Secunda <span>Discipline</span></div>
    <div class="hdr-right">
      <div class="user-pill" id="uPill"></div>
      <div class="role-pill" id="rPill">EDUCATOR</div>
      <button class="logout-btn" onclick="location.reload()">⏏</button>
    </div>
  </header>

  <div class="tabs">
    <div class="tab active" id="t-log"      onclick="sw('log')">📋 Log</div>
    <div class="tab"        id="t-learners" onclick="sw('learners')">👤 Learners</div>
    <div class="tab"        id="t-report"   onclick="sw('report')">📊 Report</div>
  </div>

  <!-- LOG TAB -->
  <main id="pg-log">
    <div class="card">
      <div class="card-title">Select Learner</div>
      <div class="fg" style="margin-bottom:8px">
        <label>Filter by Grade</label>
        <select id="gradeFilter" onchange="filterL()">
          <option value="">— All Grades —</option>
          <option value="Grade 8">Grade 8</option>
          <option value="Grade 9">Grade 9</option>
          <option value="Grade 10">Grade 10</option>
          <option value="Grade 11">Grade 11</option>
          <option value="Grade 12">Grade 12</option>
        </select>
      </div>
      <div class="sw"><span class="si">🔍</span>
        <input type="text" id="srch" placeholder="Search name…" oninput="filterL()"></div>
      <div class="ll" id="lList"></div>
    </div>

    <div class="card hidden" id="tForm">
      <div class="card-title" id="tTitle">Log Transgression</div>
      
      <!-- DETENTION BANNER FOR SELECTED LEARNER -->
      <div id="dBannerTop" class="det-banner hidden" style="margin-bottom:11px">
        <div class="di" id="dIcon">🚨</div>
        <div style="flex:1">
          <h3 id="dTitle">DETENTION REQUIRED (9+ Points)</h3>
          <p id="dBannerMsg"></p>
          <button id="dBannerAck" onclick="acknowledgeDetention(selectedLearnerId)" style="margin-top:8px;background:#ffffff33;border:1px solid #ffffff66;color:#fff;border-radius:8px;padding:6px 14px;font-size:.78rem;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif;">✅ Mark Detention Served / Acknowledged</button>
        </div>
      </div>

      <div class="fg"><label>Transgression Type</label>
        <select id="tType" onchange="autoSetPts(this.value)">
          <option value="">— Select type —</option>
          <optgroup label="2 Points">
            <option value="[M22.1] Tardiness or littering (2pts)">[M22.1] Tardiness or littering</option>
            <option value="[M22.2] Failure to have correct learning materials (2pts)">[M22.2] Failure to have correct learning materials</option>
            <option value="[M25.1] Homework not completed (2pts)">[M25.1] Homework not completed</option>
          </optgroup>
          <optgroup label="3 Points">
            <option value="[M18.2] Defiance and disrespect (3pts)">[M18.2] Defiance and disrespect</option>
            <option value="[M20.1] Disruptive behaviour (3pts)">[M20.1] Disruptive behaviour</option>
            <option value="[M21] Swearing or vulgar language (3pts)">[M21] Swearing or vulgar language</option>
          </optgroup>
          <optgroup label="5 Points">
            <option value="[S10] Absent without valid reason (5pts)">[S10] Absent without valid reason</option>
            <option value="[S13.1] Smoking (5pts)">[S13.1] Smoking</option>
          </optgroup>
        </select></div>
      <div class="fg"><label>Points to Add</label>
        <div class="pts-row">
          <button class="pb on" onclick="selPts(this,2)">+2</button>
          <button class="pb" onclick="selPts(this,3)">+3</button>
          <button class="pb" onclick="selPts(this,5)">+5</button>
        </div></div>
      <div class="fg"><label>Notes (optional)</label>
        <textarea id="tNote" placeholder="Additional context…"></textarea></div>
      <button class="btn btn-blue" id="submitBtn" onclick="submitT()">Submit Transgression</button>
    </div>
  </main>

  <!-- LEARNERS TAB -->
  <main id="pg-learners" class="hidden">
    <div class="card">
      <div class="card-title">All Learners (<span id="lCount">0</span>)</div>
      <div class="sw"><span class="si">🔍</span>
        <input type="text" id="srchAll" placeholder="Filter learners…" oninput="renderAllLearners()"></div>
      <div id="allList" class="ll"></div>
    </div>
  </main>

  <!-- REPORT TAB -->
  <main id="pg-report" class="hidden">
    <div class="sg" id="statsGrid">
      <div class="sb"><div class="sn blu" id="statTotal">0</div><div class="sl">Total Learners</div></div>
      <div class="sb"><div class="sn red" id="statDet">0</div><div class="sl">Detention (9+ Pts)</div></div>
    </div>
    <div class="card" style="margin-top:10px;">
      <div class="card-title" style="color:var(--red)">🚨 Detention List (9+ Points Threshold)</div>
      <div id="detList" class="ll"></div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
// ══ SUPABASE CONFIGURATION ══════════════════════════════════
const SUPABASE_URL = 'https://hpsjwjjidwbwgviwiitw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_deQaiTeg0FdzAlnE2vWWhQ_lCCnFoTn'; // Ensure this matches your anon key
const DETENTION_THRESHOLD = 9;

async function sb(path, method = 'GET', body = null) {
  const opts = {
    method,
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json',
      'Prefer': method === 'POST' ? 'return=representation' : ''
    }
  };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, opts);
  if (!res.ok) { const e = await res.text(); throw new Error(e); }
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}

// ══ STATE ═══════════════════════════════════════════════════
let currentUser = { name: "Anel Steyn", role: "edu" };
let learners = [];
let selectedLearnerId = null;
let currentPts = 2;

// ══ INITIALIZATION ══════════════════════════════════════════
window.onload = async () => {
  await loadLearners();
  document.getElementById("loadingScreen").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  document.getElementById("uPill").innerText = currentUser.name;
  filterL();
};

async function loadLearners() {
  try {
    const data = await sb('learners?select=*&order=name.asc');
    if (data && data.length > 0) {
      learners = data;
    } else {
      learners = [
        { id: "1", name: "Mbedzi", grade: "Grade 10", points: 10, detention_acknowledged: false },
        { id: "2", name: "Chloe Chetty", grade: "Grade 10", points: 9, detention_acknowledged: false },
        { id: "3", name: "Jaco van der Merwe", grade: "Grade 11", points: 4, detention_acknowledged: false }
      ];
    }
  } catch (e) {
    console.warn("Could not fetch from Supabase, loading fallback state:", e);
    learners = [
      { id: "1", name: "Mbedzi", grade: "Grade 10", points: 10, detention_acknowledged: false },
      { id: "2", name: "Chloe Chetty", grade: "Grade 10", points: 9, detention_acknowledged: false }
    ];
  }
}

// ══ NAVIGATION ══════════════════════════════════════════════
function sw(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('main').forEach(m => m.classList.add('hidden'));
  document.getElementById(`t-${tab}`).classList.add('active');
  document.getElementById(`pg-${tab}`).classList.remove('hidden');
  if (tab === 'learners') renderAllLearners();
  if (tab === 'report') renderReports();
}

// ══ FILTER & RENDER LOG TAB ═════════════════════════════════
function filterL() {
  const q = document.getElementById("srch").value.toLowerCase();
  const g = document.getElementById("gradeFilter").value;
  const list = document.getElementById("lList");
  list.innerHTML = "";

  const filtered = learners.filter(l => (!g || l.grade === g) && l.name.toLowerCase().includes(q));

  if (filtered.length === 0) {
    list.innerHTML = `<div
